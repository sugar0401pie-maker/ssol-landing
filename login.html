<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로그인 · 쏠 웰니스 하우스</title>
<meta name="description" content="쏠 웰니스 하우스 계정으로 로그인하세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#033667; --navy-deep:#022447; --sky:#A9C4D9; --sky-soft:#E3EDF4;
  --page:#E9EFF4; --ground:#FFFFFF; --ink:#0F1E2C; --muted:#4E5D6B; --line:#D5E1EA; --card:#FFFFFF;
  --serif:'Gowun Batang','Nanum Myeongjo',serif;
  --sans:'Noto Sans KR',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#070F17; --ground:#0B1824; --ink:#E7EEF4; --muted:#A5B6C5; --line:#23384B; --card:#11222F; --sky-soft:#132838; color-scheme:dark; }
}
:root[data-theme="dark"]{ --page:#070F17; --ground:#0B1824; --ink:#E7EEF4; --muted:#A5B6C5; --line:#23384B; --card:#11222F; --sky-soft:#132838; color-scheme:dark; }
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.6;word-break:keep-all}
.wrap{max-width:400px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:40px 20px}
.back{font-size:13px;color:var(--muted);text-decoration:none;display:inline-block;margin-bottom:18px}
.brand{text-align:center;font-family:var(--serif);font-weight:700;font-size:18px;color:var(--navy);margin:0 0 22px}
:root[data-theme="dark"] .brand{color:var(--sky)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand{color:var(--sky)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 22px}
.card h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0 0 18px}
form{display:flex;flex-direction:column;gap:10px}
input{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--page);color:var(--ink);padding:0 14px;font-size:15px;font-family:var(--sans)}
input:focus{outline:none;border-color:var(--navy)}
:root[data-theme="dark"] input:focus{border-color:var(--sky)}
.btn{height:46px;border-radius:12px;border:none;font-size:14.5px;font-weight:700;cursor:pointer;font-family:var(--sans)}
.btn-navy{background:var(--navy);color:#fff;margin-top:4px}
.btn-navy:disabled{opacity:.6;cursor:default}
.btn-kakao{background:#FEE500;color:#191600}
.link-btn{background:none;border:none;padding:0;font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-family:var(--sans);text-align:center;margin-top:2px}
.error{font-size:13px;color:#c0392b;margin:0}
.divider{display:flex;align-items:center;gap:10px;margin:16px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.divider span{font-size:12px;color:var(--muted)}
.signup-line{text-align:center;font-size:12.5px;color:var(--muted);margin-top:16px}
.signup-line a{color:var(--navy);text-decoration:underline;text-underline-offset:2px}
:root[data-theme="dark"] .signup-line a{color:var(--sky)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .signup-line a{color:var(--sky)}}
.foot{margin-top:28px;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.8}
.foot a{color:var(--navy)}
:root[data-theme="dark"] .foot a{color:var(--sky)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .foot a{color:var(--sky)}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← 홈으로</a>
  <p class="brand">쏠 웰니스 하우스</p>

  <div class="card">
    <h1>로그인하고 쏘웰라와 이야기해요</h1>
    <form id="login-form">
      <input type="email" id="email" placeholder="이메일" autocomplete="email" required>
      <input type="password" id="password" placeholder="비밀번호" autocomplete="current-password" required>
      <p class="error" id="error" hidden></p>
      <button type="submit" class="btn btn-navy" id="submit-btn">로그인</button>
      <button type="button" class="link-btn" id="forgot-btn">비밀번호를 잊으셨나요?</button>
    </form>

    <div class="divider"><span>또는</span></div>
    <button type="button" class="btn btn-kakao" id="kakao-btn">카카오로 로그인</button>

    <p class="signup-line">계정이 없으신가요? <a href="https://app.ssolwellnesshouse.com/signup">회원가입하기</a></p>
  </div>

  <div class="foot">
    <div>쏠 웰니스 하우스 · 대표 김준석 · 사업자등록번호 572-07-03549</div>
    <div>서울시 마포구 독막로 100 4층 408호 · 연락처 010-2835-2263</div>
    <div style="margin-top:6px"><a href="/privacy.html">개인정보처리방침</a> · <a href="/terms.html">이용약관</a> · <a href="/privacy-sensitive.html">민감정보 처리방침</a></div>
  </div>
</div>

<script type="module">
import { createBrowserClient } from "https://esm.sh/@supabase/ssr@0.5.2";

// 2026-09-30: quiz.ssolwellnesshouse.com / app.ssolwellnesshouse.com과 같은 Supabase
// 프로젝트, 같은 쿠키 도메인(.ssolwellnesshouse.com)을 씁니다(lib/supabase/browser.ts와
// 동일한 설정) — 그래서 여기서 로그인하면 다른 서브도메인도 이미 로그인된 상태로 봅니다.
const SUPABASE_URL = "https://ilopsiuqlmoxyizmyueb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_USH5qZsw9BTsVry3r_8lrw_u2GVAtMd";
const ROOT_DOMAIN = "ssolwellnesshouse.com";

function sharedCookieDomain(hostname) {
  const host = hostname.split(":")[0];
  return host === ROOT_DOMAIN || host.endsWith("." + ROOT_DOMAIN) ? "." + ROOT_DOMAIN : undefined;
}

const supabase = createBrowserClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  cookieOptions: { domain: sharedCookieDomain(window.location.hostname) },
});

const AFTER_LOGIN_URL = "https://app.ssolwellnesshouse.com/chat";

const form = document.getElementById("login-form");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const errorEl = document.getElementById("error");
const submitBtn = document.getElementById("submit-btn");
const kakaoBtn = document.getElementById("kakao-btn");
const forgotBtn = document.getElementById("forgot-btn");

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.hidden = false;
}

// 카카오 로그인 후 이 페이지로 돌아왔을 때(URL에 인증 코드가 있으면 supabase-js가 자동으로
// 세션을 완성합니다) 바로 쏘웰라로 넘어갑니다.
supabase.auth.getSession().then(({ data }) => {
  if (data.session) window.location.href = AFTER_LOGIN_URL;
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorEl.hidden = true;
  submitBtn.disabled = true;
  submitBtn.textContent = "확인하는 중…";
  const { error } = await supabase.auth.signInWithPassword({
    email: emailInput.value.trim(),
    password: passwordInput.value,
  });
  submitBtn.disabled = false;
  submitBtn.textContent = "로그인";
  if (error) {
    showError("이메일 또는 비밀번호를 확인해주세요.");
    return;
  }
  window.location.href = AFTER_LOGIN_URL;
});

kakaoBtn.addEventListener("click", async () => {
  errorEl.hidden = true;
  const { error } = await supabase.auth.signInWithOAuth({
    provider: "kakao",
    options: { redirectTo: window.location.origin + "/login.html" },
  });
  if (error) showError("카카오 로그인을 시작하지 못했어요. 잠시 후 다시 시도해주세요.");
});

forgotBtn.addEventListener("click", () => {
  // app.ssolwellnesshouse.com은 로그인/비밀번호 재설정이 "/" 안의 화면 상태로만 있고
  // 별도 주소가 없어서, 거기로 보내드립니다.
  window.location.href = "https://app.ssolwellnesshouse.com/";
});
</script>
</body>
</html>
